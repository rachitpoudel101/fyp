<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">Profile</h1>
        <div class="bg-white shadow-md rounded-lg p-6">
            <div class="flex items-center">
                {% if user.role == 'admin' %}
                    <img src="{% static 'images/admin-icon.png' %}" alt="Admin Icon" class="w-12 h-12 mr-4">
                {% endif %}
                <div>
                    <p><strong>Username:</strong> {{ user.username }}</p>
                    <p><strong>Email:</strong> {{ user.email }}</p>
                    <p><strong>Role:</strong> {{ user.get_role_display }}</p>
                </div>
            </div>
            {% if user.role == 'admin' and not user.is_verified %}
                <form method="post" action="{% url 'request_verification' %}">
                    {% csrf_token %}
                    <button type="submit" class="mt-4 bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
                        Verify Your Profile
                    </button>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
